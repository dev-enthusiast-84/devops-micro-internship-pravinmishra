<svg viewBox="0 0 2400 1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-main { font-size: 52px; font-weight: bold; fill: #003366; text-anchor: middle; }
      .title-sub { font-size: 18px; fill: #27AE60; text-anchor: middle; letter-spacing: 2px; font-weight: bold; }
      .tier-header { fill: white; font-weight: bold; font-size: 18px; text-anchor: middle; }
      .label-xl { font-size: 16px; font-weight: bold; fill: #232F3E; }
      .label-lg { font-size: 14px; font-weight: bold; fill: #232F3E; }
      .label { font-size: 12px; fill: #232F3E; }
      .label-sm { font-size: 11px; fill: #666; }
      .label-xs { font-size: 10px; fill: #888; }
      .label-white { font-size: 12px; fill: white; font-weight: bold; }
      .arrow { stroke: #232F3E; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .vpc-border { fill: none; stroke: #27AE60; stroke-width: 3; stroke-dasharray: 8,4; }
      .subnet-border { fill: none; stroke: #999; stroke-width: 1.5; }
      .tier-bg { fill: #F9F9F9; }
      .alb-circle { fill: #9966CC; stroke: #232F3E; stroke-width: 2; }
      .ec2-box { fill: #FF9900; stroke: #232F3E; stroke-width: 2; border-radius: 4px; }
      .rds-circle { fill: #9966CC; stroke: #232F3E; stroke-width: 2; }
      .icon-text { font-size: 28px; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto">
      <polygon points="0 0, 15 6, 0 12" fill="#232F3E" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="2400" height="1600" fill="white"/>

  <!-- AWS Logo -->
