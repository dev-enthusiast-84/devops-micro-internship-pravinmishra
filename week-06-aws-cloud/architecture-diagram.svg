<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .vpc-border { fill: none; stroke: #FF9900; stroke-width: 3; stroke-dasharray: 5,5; }
      .az-border { fill: none; stroke: #146EB4; stroke-width: 2; stroke-dasharray: 3,3; }
      .subnet-public { fill: #E8F4F8; stroke: #0073BB; stroke-width: 2; }
      .subnet-private { fill: #F0E8F4; stroke: #7A3E8C; stroke-width: 2; }
      .component-box { fill: #FF9900; stroke: #232F3E; stroke-width: 2; }
      .component-box-blue { fill: #0073BB; stroke: #232F3E; stroke-width: 2; }
      .component-box-green { fill: #27AE60; stroke: #232F3E; stroke-width: 2; }
      .label { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #232F3E; text-anchor: middle; }
      .label-small { font-family: Arial, sans-serif; font-size: 10px; fill: #232F3E; text-anchor: middle; }
      .label-white { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: white; text-anchor: middle; }
      .arrow { stroke: #232F3E; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke: #232F3E; stroke-width: 1.5; stroke-dasharray: 3,3; fill: none; marker-end: url(#arrowhead); }
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #232F3E; }
      .legend-text { font-family: Arial, sans-serif; font-size: 10px; fill: #232F3E; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#232F3E" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="25" class="title">Book Review App - Three-Tier Architecture on AWS</text>

  <!-- VPC Border -->
  <rect x="30" y="60" width="1340" height="800" class="vpc-border"/>
  <text x="50" y="78" class="label-small" fill="#FF9900">VPC: 10.0.0.0/16</text>

  <!-- AVAILABILITY ZONE 1 -->
  <rect x="50" y="100" width="630" height="740" class="az-border"/>
  <text x="70" y="120" class="label-small" fill="#0073BB">Availability Zone 1 (us-east-1a)</text>

  <!-- AZ1: Web Tier (Public) -->
  <rect x="70" y="140" width="280" height="100" class="subnet-public"/>
  <text x="210" y="158" class="label">Web Tier - Public</text>
  <text x="210" y="175" class="label-small">10.0.1.0/24</text>

  <!-- AZ1: Web Tier EC2 -->
  <rect x="100" y="180" width="90" height="45" class="component-box"/>
  <text x="145" y="207" class="label-white" font-size="10">Web EC2</text>
  <text x="145" y="220" class="label-white" font-size="9">Nginx</text>

  <!-- AZ1: App Tier (Private) -->
  <rect x="70" y="260" width="280" height="100" class="subnet-private"/>
  <text x="210" y="278" class="label">App Tier - Private</text>
  <text x="210" y="295" class="label-small">10.0.3.0/24</text>

  <!-- AZ1: App Tier EC2 -->
  <rect x="100" y="300" width="90" height="45" class="component-box-blue"/>
  <text x="145" y="327" class="label-white" font-size="10">App EC2</text>
  <text x="145" y="340" class="label-white" font-size="9">Node.js</text>

  <!-- AZ1: Database Tier (Private) -->
  <rect x="70" y="380" width="280" height="100" class="subnet-private"/>
  <text x="210" y="398" class="label">Database Tier - Private</text>
  <text x="210" y="415" class="label-small">10.0.5.0/24</text>

  <!-- AZ1: RDS Primary -->
  <rect x="100" y="420" width="90" height="45" class="component-box-green"/>
  <text x="145" y="445" class="label-white" font-size="10">RDS MySQL</text>
  <text x="145" y="458" class="label-white" font-size="8">Primary (AZ1)</text>

  <!-- AVAILABILITY ZONE 2 -->
  <rect x="720" y="100" width="630" height="740" class="az-border"/>
  <text x="740" y="120" class="label-small" fill="#0073BB">Availability Zone 2 (us-east-1b)</text>

  <!-- AZ2: Web Tier (Public) -->
  <rect x="740" y="140" width="280" height="100" class="subnet-public"/>
  <text x="880" y="158" class="label">Web Tier - Public</text>
  <text x="880" y="175" class="label-small">10.0.2.0/24</text>

  <!-- AZ2: Web Tier EC2 -->
  <rect x="770" y="180" width="90" height="45" class="component-box"/>
  <text x="815" y="207" class="label-white" font-size="10">Web EC2</text>
  <text x="815" y="220" class="label-white" font-size="9">Nginx</text>

  <!-- AZ2: App Tier (Private) -->
  <rect x="740" y="260" width="280" height="100" class="subnet-private"/>
  <text x="880" y="278" class="label">App Tier - Private</text>
  <text x="880" y="295" class="label-small">10.0.4.0/24</text>

  <!-- AZ2: App Tier EC2 -->
  <rect x="770" y="300" width="90" height="45" class="component-box-blue"/>
  <text x="815" y="327" class="label-white" font-size="10">App EC2</text>
  <text x="815" y="340" class="label-white" font-size="9">Node.js</text>

  <!-- AZ2: Database Tier (Private) -->
  <rect x="740" y="380" width="280" height="100" class="subnet-private"/>
  <text x="880" y="398" class="label">Database Tier - Private</text>
  <text x="880" y="415" class="label-small">10.0.6.0/24</text>

  <!-- AZ2: RDS Read Replica -->
  <rect x="770" y="420" width="90" height="45" class="component-box-green"/>
  <text x="815" y="445" class="label-white" font-size="10">RDS MySQL</text>
  <text x="815" y="458" class="label-white" font-size="8">Read Replica (AZ2)</text>

  <!-- INTERNET & LOAD BALANCERS (Outside VPC visually, but conceptually part of it) -->

  <!-- Internet Gateway -->
  <rect x="400" y="20" width="100" height="40" class="component-box"/>
  <text x="450" y="48" class="label-white" font-size="11">Internet</text>

  <!-- Public ALB -->
  <rect x="340" y="540" width="200" height="60" class="component-box"/>
  <text x="440" y="565" class="label-white" font-size="12">Public ALB</text>
  <text x="440" y="580" class="label-white" font-size="10">(Web Tier)</text>

  <!-- Internal ALB -->
  <rect x="1020" y="540" width="200" height="60" class="component-box-blue"/>
  <text x="1120" y="565" class="label-white" font-size="12">Internal ALB</text>
  <text x="1120" y="580" class="label-white" font-size="10">(App Tier)</text>

  <!-- TRAFFIC FLOW ARROWS -->

  <!-- Internet to Public ALB -->
  <path d="M 450 60 L 440 540" class="arrow"/>
  <text x="465" y="290" class="legend-text">HTTPS/HTTP</text>

  <!-- Public ALB to Web Tier -->
  <path d="M 390 600 L 210 185" class="arrow"/>
  <path d="M 490 600 L 880 185" class="arrow"/>

  <!-- Web Tier to Internal ALB -->
  <path d="M 210 330 L 1050 545" class="arrow-dashed"/>
  <path d="M 880 330 L 1080 545" class="arrow-dashed"/>
  <text x="520" y="440" class="legend-text">HTTP (Port 3000)</text>

  <!-- Internal ALB to App Tier -->
  <path d="M 1050 600 L 210 330" class="arrow"/>
  <path d="M 1120 600 L 880 330" class="arrow"/>

  <!-- App Tier to RDS -->
  <path d="M 210 450 L 210 450" class="arrow-dashed" stroke-width="2"/>
  <path d="M 210 345 L 210 420" class="arrow"/>
  <path d="M 880 345 L 815 420" class="arrow"/>
  <text x="260" y="390" class="legend-text">MySQL (3306)</text>

  <!-- RDS Replication -->
  <path d="M 200 442 L 760 442" class="arrow-dashed"/>
  <text x="480" y="435" class="legend-text">Multi-AZ Sync Replication</text>

  <!-- LEGEND -->
  <g>
    <text x="50" y="870" class="label" font-size="12">Legend:</text>

    <rect x="150" y="855" width="15" height="15" class="subnet-public"/>
    <text x="175" y="866" class="legend-text">Public Subnet</text>

    <rect x="280" y="855" width="15" height="15" class="subnet-private"/>
    <text x="305" y="866" class="legend-text">Private Subnet</text>

    <rect x="420" y="855" width="15" height="15" class="component-box"/>
    <text x="445" y="866" class="legend-text">AWS Service</text>

    <line x1="570" y1="862" x2="590" y2="862" class="arrow"/>
    <text x="600" y="866" class="legend-text">Traffic Flow</text>
  </g>

  <!-- KEY FEATURES BOX -->
  <g>
    <rect x="50" y="535" width="280" height="310" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="65" y="555" class="label" font-size="11">Key Features:</text>
    <text x="65" y="575" class="legend-text">✓ Custom VPC: 10.0.0.0/16</text>
    <text x="65" y="590" class="legend-text">✓ 6 Subnets across 2 AZs</text>
    <text x="65" y="605" class="legend-text">✓ Public & Private tiers</text>
    <text x="65" y="620" class="legend-text">✓ 2 Application Load Balancers</text>
    <text x="65" y="635" class="legend-text">✓ 4 EC2 instances (2 Web, 2 App)</text>
    <text x="65" y="650" class="legend-text">✓ Multi-AZ RDS with read replica</text>
    <text x="65" y="665" class="legend-text">✓ Security groups for each tier</text>
    <text x="65" y="680" class="legend-text">✓ Internet Gateway + NAT Gateway</text>
    <text x="65" y="695" class="legend-text">✓ High availability & fault tolerance</text>
    <text x="65" y="710" class="legend-text">✓ Isolated database tier</text>
    <text x="65" y="725" class="legend-text">✓ CloudWatch + VPC Flow Logs</text>
    <text x="65" y="740" class="legend-text">✓ Target Groups for ALBs</text>
  </g>

</svg>